# Builds tmath and runs its suite in each configuration it is checked in:
# GCC and Clang, Debug and Release, and the address and undefined-behaviour
# sanitizers.
#
# glm is fetched at the commit CMakeLists.txt pins, and hamr (the suite's
# test library) is checked out at its pin.
name: Linux

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc release,       cxx: g++,     type: Release }
          - { name: gcc debug,         cxx: g++,     type: Debug }
          - { name: clang release,     cxx: clang++, type: Release }
          - { name: address sanitizer, cxx: g++,     type: RelWithDebInfo, flags: -DTMATH_SANITIZE=address }
          - { name: ub sanitizer,      cxx: g++,     type: RelWithDebInfo, flags: -DTMATH_SANITIZE=undefined }
    steps:
      - uses: actions/checkout@v5

      - name: The pinned hamr commit
        id: pins
        run: echo "hamr=$(sed -n 's/^set(TMATH_HAMR_COMMIT \([0-9a-f]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out hamr
        uses: actions/checkout@v5
        with:
          repository: Aosiee/hamr
          ref: ${{ steps.pins.outputs.hamr }}
          path: external/hamr

      # The sanitizers' shadow memory does not fit beside the runner's
      # default address randomisation.
      - name: Reduce address randomisation
        if: contains(matrix.flags, 'TMATH_SANITIZE')
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          ${{ matrix.cxx }} --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTMATH_HAMR_DIR="$GITHUB_WORKSPACE/external/hamr" ${{ matrix.flags }}

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: timeout 15m build/tmath_tests
